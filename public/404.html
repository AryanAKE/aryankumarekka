<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aryan Kumar Ekka</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the current path/query/hash into the URL before redirecting to index.html
      // so the app can restore the correct route on load.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
